<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion · Le Five du Bitume</title>
  <link rel="stylesheet" href="style.css?v=terrains">
  <link rel="stylesheet" href="vote-bandeau.css">
  <style>
    .admin-bandeau h1 {
      max-width: 54%;
      font-size: clamp(1.1rem, 4.1vw, 3.35rem);
      overflow-wrap: anywhere;
    }
  #gestion-admin summary { cursor:pointer; font-weight:700; padding:.8rem 0 }
    .match-choix { display:flex; flex-wrap:wrap; gap:.6rem }
    .match-choix button { text-align:left; min-height:48px }
    .match-choix button[aria-pressed=true] { border-color:var(--lime); color:var(--lime) }
    #lignes-joueurs .row { flex-wrap:wrap; gap:.6rem; padding:.8rem 0 }
    #lignes-joueurs select { min-height:44px }
    </style>
  <script src="supabase-config.js" defer></script>
  <script src="connexion.js?v=pilotage" defer></script>
<script src="disponibilites.js?v=terrains" defer></script><script src="gestion-admin.js?v=cartons-motif" defer></script></head>
<body>
  <main class="wrap">
    <p><a href="index.html">Accueil du Five du Bitume</a></p>
    <header class="vote-bandeau admin-bandeau">
      <img src="banc-bitume.webp" alt="" width="1280" height="720" decoding="async">
      <h1>Espace administrateur</h1>
    </header>
    <form id="connexion" class="card section">
      <label>Adresse e-mail
        <input name="email" type="email" autocomplete="username" required>
      </label>
      <label>Mot de passe
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn">Se connecter</button>
    </form>
    <p id="resultat" class="section" role="status"></p>
  </main>
</body>
</html>
