<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace joueur · Le Five du Bitume</title>
  <link rel="stylesheet" href="style.css?v=terrains">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.89.0/dist/umd/supabase.js" defer></script>
  <script src="supabase-config.js" defer></script>
  <script src="disponibilites.js?v=telephone" defer></script>
  <link rel="stylesheet" href="five-maillots.css"><script src="maillots.js" defer></script><script src="joueur.js?v=multi-five" defer></script>
</head>
<body>
  <main class="wrap" id="espace-joueur">
    <p><a href="index.html">Accueil</a> · <a href="connexion.html">Espace administrateur</a></p>
    <h1>Espace joueur</h1>
    <p id="joueur-message" role="status">Chargement…</p>
    <form id="joueur-inscription" class="card section" hidden>
      <div id="terrain-five-joueur" class="terrain-five"></div>
      <label>Ton vrai prénom
        <input name="prenom" autocomplete="given-name" maxlength="40" required>
      </label>
      <label>Ton numéro de téléphone
        <input name="telephone" type="tel" autocomplete="tel" required>
      </label>
      <fieldset id="choix-maillot">
        <legend>Ton maillot préféré (facultatif)</legend>
        <label>Club ou sélection
          <input name="equipe" maxlength="80" placeholder="Ex. OM, Real Madrid, Algérie" autocomplete="off" aria-controls="suggestions-maillots">
        </label>
        <div id="suggestions-maillots"></div>
      </fieldset>
      <p>Seul l’administrateur voit ton numéro. Aucun message automatique.</p>
      <button class="btn">Je m’engage à venir au match</button>
    </form>
    <section class="card section" id="joueur-matchs" hidden>
      <h2>Matchs à venir</h2>
      <div id="joueur-liste"></div>
    </section>
  </main>
</body>
</html>
